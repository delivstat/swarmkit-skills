apiVersion: swarmkit/v1
kind: Skill
metadata:
  id: fs-list-directory
  name: Fs List Directory
  description: "Lists the entries in one directory. Cheaper than a tree walk when the agent only needs\
    \ to orient \u2014 and it keeps a large repository from filling the context window."
category: capability
implementation:
  type: mcp_tool
  server: filesystem
  tool: list_directory
iam:
  required_scopes:
  - workspace:read
provenance:
  authored_by: human
  version: 1.0.0
  requires_runtime: '>=1.199.0'
  registry: swarmkit-skills
