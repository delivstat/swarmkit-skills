apiVersion: swarmkit/v1
kind: Skill
metadata:
  id: fs-search-files
  name: Fs Search Files
  description: Finds files matching a pattern under a root. Search is how an agent locates the thing it
    was asked about. Without it every task starts with the agent asking you where something is.
category: capability
implementation:
  type: mcp_tool
  server: filesystem
  tool: search_files
iam:
  required_scopes:
  - workspace:read
provenance:
  authored_by: human
  version: 1.0.0
  requires_runtime: '>=1.199.0'
  registry: swarmkit-skills
