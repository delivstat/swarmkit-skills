apiVersion: swarmkit/v1
kind: Skill
metadata:
  id: cdt-analyze-insight
  name: Analyze Insight
  description: Explains one insight from a captured trace in detail. A trace is thousands of events. This
    is the tool that turns it into a sentence about what to fix.
category: capability
implementation:
  type: mcp_tool
  server: chrome-devtools
  tool: performance_analyze_insight
iam:
  required_scopes:
  - workspace:read
provenance:
  authored_by: human
  version: 1.0.0
  requires_runtime: '>=1.199.0'
  registry: swarmkit-skills
