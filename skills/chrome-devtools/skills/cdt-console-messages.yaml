apiVersion: swarmkit/v1
kind: Skill
metadata:
  id: cdt-console-messages
  name: Console Messages
  description: Lists every console message on the page since the last navigation. A page that renders
    correctly and logs a stack trace on every keystroke is broken in a way no screenshot shows. This is
    the cheapest signal that something is wrong.
category: capability
implementation:
  type: mcp_tool
  server: chrome-devtools
  tool: list_console_messages
iam:
  required_scopes:
  - workspace:read
provenance:
  authored_by: human
  version: 1.0.0
  requires_runtime: '>=1.199.0'
  registry: swarmkit-skills
