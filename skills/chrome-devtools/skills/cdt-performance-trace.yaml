apiVersion: swarmkit/v1
kind: Skill
metadata:
  id: cdt-performance-trace
  name: Performance Trace
  description: Starts a performance trace, reloading the page to capture it. Core Web Vitals are measured,
    not guessed. This is the measurement.
category: capability
implementation:
  type: mcp_tool
  server: chrome-devtools
  tool: performance_start_trace
iam:
  required_scopes:
  - workspace:write
provenance:
  authored_by: human
  version: 1.0.0
  requires_runtime: '>=1.199.0'
  registry: swarmkit-skills
