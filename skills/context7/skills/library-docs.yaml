apiVersion: swarmkit/v1
kind: Skill
metadata:
  id: library-docs
  name: Library Docs
  description: Fetches current documentation for a library. A model's knowledge of a fast-moving library
    is as old as its training data. This is the cheapest available fix for confidently-wrong API usage.
category: capability
implementation:
  type: mcp_tool
  server: context7
  tool: query-docs
iam:
  required_scopes:
  - workspace:read
provenance:
  authored_by: human
  version: 1.0.0
  requires_runtime: '>=1.199.0'
  registry: swarmkit-skills
