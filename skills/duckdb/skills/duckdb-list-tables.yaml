apiVersion: swarmkit/v1
kind: Skill
metadata:
  id: duckdb-list-tables
  name: DuckDB List Tables
  description: Lists the tables and views in the database, with their comments. An agent writing SQL against
    a schema it has not seen invents column names. This is the call that stops that.
category: capability
implementation:
  type: mcp_tool
  server: duckdb
  tool: list_tables
iam:
  required_scopes:
  - workspace:read
provenance:
  authored_by: human
  version: 1.0.0
  requires_runtime: '>=1.199.0'
  registry: swarmkit-skills
