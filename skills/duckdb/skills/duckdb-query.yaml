apiVersion: swarmkit/v1
kind: Skill
metadata:
  id: duckdb-query
  name: DuckDB Query
  description: Executes a SQL query. In the in-memory configuration above, against files on disk. SQL
    over a directory of Parquet files, with no ingestion and no server, is the cheapest analytical capability
    available to a swarm.
category: capability
implementation:
  type: mcp_tool
  server: duckdb
  tool: execute_query
iam:
  required_scopes:
  - workspace:write
provenance:
  authored_by: human
  version: 1.0.0
  requires_runtime: '>=1.199.0'
  registry: swarmkit-skills
