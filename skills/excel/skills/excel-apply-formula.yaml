apiVersion: swarmkit/v1
kind: Skill
metadata:
  id: excel-apply-formula
  name: Excel Apply Formula
  description: Writes a formula into a cell. A formula keeps recalculating after the agent has gone, which
    is the difference between a snapshot and a working sheet.
category: capability
implementation:
  type: mcp_tool
  server: excel
  tool: apply_formula
iam:
  required_scopes:
  - workspace:write
provenance:
  authored_by: human
  version: 1.0.0
  requires_runtime: '>=1.199.0'
  registry: swarmkit-skills
