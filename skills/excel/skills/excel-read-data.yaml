apiVersion: swarmkit/v1
kind: Skill
metadata:
  id: excel-read-data
  name: Excel Read Data
  description: Reads a cell range from a worksheet. The read half, and usually the only half you want.
    Extraction and reconciliation tasks read a sheet and write nothing.
category: capability
implementation:
  type: mcp_tool
  server: excel
  tool: read_data_from_excel
iam:
  required_scopes:
  - workspace:read
provenance:
  authored_by: human
  version: 1.0.0
  requires_runtime: '>=1.199.0'
  registry: swarmkit-skills
