apiVersion: swarmkit/v1
kind: Skill
metadata:
  id: excel-validate-range
  name: Excel Validate Range
  description: Checks that a range exists and is well-formed before anything touches it. Turns a silently
    empty read into an error. A range that is off by one sheet returns nothing, which looks exactly like
    a sheet with no data.
category: capability
implementation:
  type: mcp_tool
  server: excel
  tool: validate_excel_range
iam:
  required_scopes:
  - workspace:read
provenance:
  authored_by: human
  version: 1.0.0
  requires_runtime: '>=1.199.0'
  registry: swarmkit-skills
