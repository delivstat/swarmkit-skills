apiVersion: swarmkit/v1
kind: Skill
metadata:
  id: excel-workbook-metadata
  name: Excel Workbook Metadata
  description: "Returns the sheets, used ranges and structure of a workbook. A workbook is not a table\
    \ \u2014 it is several, at unpredictable offsets, often with a title row. Reading A1:Z100 and hoping\
    \ is how an agent reports confident nonsense."
category: capability
implementation:
  type: mcp_tool
  server: excel
  tool: get_workbook_metadata
iam:
  required_scopes:
  - workspace:read
provenance:
  authored_by: human
  version: 1.0.0
  requires_runtime: '>=1.199.0'
  registry: swarmkit-skills
