apiVersion: swarmkit/v1
kind: SkillBundle
metadata:
  id: filesystem
  name: Filesystem
  description: Read, write and search files under a directory you nominate.
server:
  id: filesystem
  transport: stdio
  command:
  - npx
  - -y
  - '@modelcontextprotocol/server-filesystem'
  - ${SWARMKIT_FS_ROOT}
  permission: cautious
  effects:
    read_file: read
    read_multiple_files: read
    list_directory: read
    directory_tree: read
    search_files: read
    get_file_info: read
    write_file: write
    edit_file: write
    create_directory: write
    move_file: write
skills:
- fs-read-file
- fs-list-directory
- fs-search-files
- fs-write-file
requires_runtime: '>=1.199.0'
provenance:
  upstream: npm @modelcontextprotocol/server-filesystem
  maintainer: delivstat/swarmkit-skills
verification:
  state: verified
  checked_at: '2026-09-08'
  detail: 4 tool(s) present
check:
  invoke:
    tool: list_directory
    args:
      path: .
    expect: skills
