apiVersion: swarmkit/v1
kind: Skill
metadata:
  id: fs-read-file
  name: Fs Read File
  description: Reads one file and returns its contents. An agent that can read the repository it is reasoning
    about stops guessing at file contents, which is the single largest source of confident-but-wrong output.
category: capability
implementation:
  type: mcp_tool
  server: filesystem
  tool: read_file
iam:
  required_scopes:
  - workspace:read
provenance:
  authored_by: human
  version: 1.0.0
  requires_runtime: '>=1.199.0'
  registry: swarmkit-skills
