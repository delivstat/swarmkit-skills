apiVersion: swarmkit/v1
kind: Skill
metadata:
  id: search-threads
  name: Search Threads
  description: Search the signed-in user's Gmail using Gmail's own search syntax and return matching thread ids. What a swarm does when it wants "recent emails about X" or "everything from Y this week".
category: capability
implementation:
  type: mcp_tool
  server: gmail
  tool: search_threads
requires_credentials:
  - gmail
iam:
  required_scopes:
  - workspace:read
provenance:
  authored_by: human
  version: 1.0.0
  requires_runtime: '>=1.261.0'
  registry: swarmkit-skills
