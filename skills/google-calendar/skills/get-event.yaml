apiVersion: swarmkit/v1
kind: Skill
metadata:
  id: get-event
  name: Get Event
  description: Fetch a single calendar event by id — attendees, description, conferencing links, recurrence details. Useful when a swarm already knows which event it cares about (from a search or a list) and wants the full picture without paging through a list response.
category: capability
implementation:
  type: mcp_tool
  server: google-calendar
  tool: get_event
requires_credentials:
  - google-calendar
iam:
  required_scopes:
  - workspace:read
provenance:
  authored_by: human
  version: 1.0.0
  requires_runtime: '>=1.261.0'
  registry: swarmkit-skills
