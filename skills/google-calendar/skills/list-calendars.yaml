apiVersion: swarmkit/v1
kind: Skill
metadata:
  id: list-calendars
  name: List Calendars
  description: List the calendars the signed-in user has access to — their own primary calendar plus every shared one they can read. What a swarm reaches for when it needs to know "which calendars are in play" before drilling into events on a specific one.
category: capability
implementation:
  type: mcp_tool
  server: google-calendar
  tool: list_calendars
requires_credentials:
  - google-calendar
iam:
  required_scopes:
  - workspace:read
provenance:
  authored_by: human
  version: 1.0.0
  requires_runtime: '>=1.261.0'
  registry: swarmkit-skills
