apiVersion: swarmkit/v1
kind: Skill
metadata:
  id: list-events
  name: List Events
  description: Fetch events from a specific calendar over a time window. The primary reading tool — what a morning-brief-style swarm calls for "what's on today and tomorrow" before ranking or prepping.
category: capability
implementation:
  type: mcp_tool
  server: google-calendar
  tool: list_events
iam:
  required_scopes:
  - workspace:read
provenance:
  authored_by: human
  version: 1.0.0
  requires_runtime: '>=1.259.0'
  registry: swarmkit-skills
