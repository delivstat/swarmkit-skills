apiVersion: swarmkit/v1
kind: Skill
metadata:
  id: suggest-time
  name: Suggest Time
  description: Ask Google Calendar for candidate meeting slots given a set of attendees, a desired duration, and a search window. Read-only — it returns suggestions, it does not create the meeting. Useful for meeting-prep agents that want to answer "when could we all get together this week" without booking anything.
category: capability
implementation:
  type: mcp_tool
  server: google-calendar
  tool: suggest_time
requires_credentials:
  - google-calendar
iam:
  required_scopes:
  - workspace:read
provenance:
  authored_by: human
  version: 1.0.0
  requires_runtime: '>=1.261.0'
  registry: swarmkit-skills
