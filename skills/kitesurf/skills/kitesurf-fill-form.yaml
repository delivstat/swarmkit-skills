apiVersion: swarmkit/v1
kind: Skill
metadata:
  id: kitesurf-fill-form
  name: Kitesurf Fill Form
  description: Fill several form fields at once — inputs, selects, checkboxes, radios — by uid. Sends
    whatever it is given to the site, so what the agent may put in a form is the real question.
category: capability
implementation:
  type: mcp_tool
  server: kitesurf
  tool: fill_form
iam:
  required_scopes:
  - web:act
provenance:
  authored_by: human
  version: 1.0.0
  requires_runtime: '>=1.199.0'
  registry: swarmkit-skills
