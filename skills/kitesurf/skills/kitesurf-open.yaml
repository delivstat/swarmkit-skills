apiVersion: swarmkit/v1
kind: Skill
metadata:
  id: kitesurf-open
  name: Kitesurf Open
  description: Go to a URL, or back, forward or reload. The way into the web — and the way out of it,
    since a URL can carry anything the agent puts in it.
category: capability
implementation:
  type: mcp_tool
  server: kitesurf
  tool: navigate_page
iam:
  required_scopes:
  - web:navigate
provenance:
  authored_by: human
  version: 1.0.0
  requires_runtime: '>=1.199.0'
  registry: swarmkit-skills
