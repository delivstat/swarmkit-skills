apiVersion: swarmkit/v1
kind: Skill
metadata:
  id: kitesurf-screenshot
  name: Kitesurf Screenshot
  description: Capture the open page, or one element of it, as an image. For a model that can see —
    charts, layout, anything the text of the page does not carry.
category: capability
implementation:
  type: mcp_tool
  server: kitesurf
  tool: take_screenshot
iam:
  required_scopes:
  - web:read
provenance:
  authored_by: human
  version: 1.0.0
  requires_runtime: '>=1.199.0'
  registry: swarmkit-skills
