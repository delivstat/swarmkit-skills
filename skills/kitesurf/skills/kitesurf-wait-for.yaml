apiVersion: swarmkit/v1
kind: Skill
metadata:
  id: kitesurf-wait-for
  name: Kitesurf Wait For
  description: Wait until some text appears on the open page. For pages that render after load, so the
    agent reads the result rather than the spinner.
category: capability
implementation:
  type: mcp_tool
  server: kitesurf
  tool: wait_for
iam:
  required_scopes:
  - web:read
provenance:
  authored_by: human
  version: 1.0.0
  requires_runtime: '>=1.199.0'
  registry: swarmkit-skills
