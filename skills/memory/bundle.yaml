apiVersion: swarmkit/v1
kind: SkillBundle
metadata:
  id: memory
  name: Memory
  description: A knowledge graph the agent can write to and read back.
server:
  id: memory
  transport: stdio
  command:
  - npx
  - -y
  - '@modelcontextprotocol/server-memory'
  permission: cautious
  effects:
    read_graph: read
    search_nodes: read
    open_nodes: read
    create_entities: write
    create_relations: write
    add_observations: write
    delete_entities: write
    delete_relations: write
skills:
- memory-search
- memory-write
requires_runtime: '>=1.199.0'
provenance:
  upstream: npm @modelcontextprotocol/server-memory
  maintainer: delivstat/swarmkit-skills
verification:
  state: broken
  checked_at: '2026-09-04'
  detail: 'ExceptionGroup: unhandled errors in a TaskGroup (1 sub-exception)'
check:
  invoke:
    tool: read_graph
    args: {}
