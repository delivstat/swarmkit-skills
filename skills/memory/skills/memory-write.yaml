apiVersion: swarmkit/v1
kind: Skill
metadata:
  id: memory-write
  name: Memory Write
  description: 'Adds entities to the knowledge graph. Declared effects: write. What an agent stores it
    can later act on, so what goes in matters more than it first appears.'
category: capability
implementation:
  type: mcp_tool
  server: memory
  tool: create_entities
iam:
  required_scopes:
  - workspace:write
provenance:
  authored_by: human
  version: 1.0.0
  requires_runtime: '>=1.199.0'
  registry: swarmkit-skills
