apiVersion: swarmkit/v1
kind: SkillBundle
metadata:
  id: sequential-thinking
  name: Sequential Thinking
  description: A structured scratchpad for multi-step reasoning.
server:
  id: sequential-thinking
  transport: stdio
  command:
  - npx
  - -y
  - '@modelcontextprotocol/server-sequential-thinking'
  permission: readonly
  effects:
    sequentialthinking: read
skills:
- sequential-thinking
requires_runtime: '>=1.199.0'
provenance:
  upstream: npm @modelcontextprotocol/server-sequential-thinking
  maintainer: delivstat/swarmkit-skills
verification:
  state: verified
  checked_at: '2026-11-24'
  detail: 1 tool(s) present
check:
  hint_overrides:
    sequentialthinking: 'Upstream 2.x marks it not read-only because each call appends to the server''s
      own in-memory thought history (destructiveHint and openWorldHint are both false). Nothing outside
      the server changes, which is what `read` means under `permission: readonly`.'
  invoke:
    tool: sequentialthinking
    args:
      thought: A contract check calls the tool rather than listing it.
      nextThoughtNeeded: false
      thoughtNumber: 1
      totalThoughts: 1
