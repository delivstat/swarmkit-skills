apiVersion: swarmkit/v1
kind: Skill
metadata:
  id: sequential-thinking
  name: Sequential Thinking
  description: Records and revises a chain of reasoning steps. Makes a model's plan explicit and revisable
    rather than buried in prose. The steps land in the run trace, so a wrong answer can be traced to the
    step that went wrong.
category: capability
implementation:
  type: mcp_tool
  server: sequential-thinking
  tool: sequentialthinking
iam:
  required_scopes:
  - workspace:read
provenance:
  authored_by: human
  version: 1.0.0
  requires_runtime: '>=1.199.0'
  registry: swarmkit-skills
