apiVersion: swarmkit/v1
kind: Skill
metadata:
  id: serena-diagnostics
  name: Serena Diagnostics
  description: "Returns the language server's diagnostics for a file \u2014 errors and warnings. The compiler's\
    \ opinion, which beats the model's. An agent that checks this before proposing a change stops proposing\
    \ code that does not type-check."
category: capability
implementation:
  type: mcp_tool
  server: serena
  tool: get_diagnostics_for_file
iam:
  required_scopes:
  - workspace:read
provenance:
  authored_by: human
  version: 1.0.0
  requires_runtime: '>=1.199.0'
  registry: swarmkit-skills
