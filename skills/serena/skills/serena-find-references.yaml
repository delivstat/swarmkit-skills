apiVersion: swarmkit/v1
kind: Skill
metadata:
  id: serena-find-references
  name: Serena Find References
  description: Finds everything that references a symbol. This is the impact-analysis call. *What breaks
    if I change this* is not answerable by search, because a caller need not mention the name in a form
    grep can match.
category: capability
implementation:
  type: mcp_tool
  server: serena
  tool: find_referencing_symbols
iam:
  required_scopes:
  - workspace:read
provenance:
  authored_by: human
  version: 1.0.0
  requires_runtime: '>=1.199.0'
  registry: swarmkit-skills
