apiVersion: swarmkit/v1
kind: Skill
metadata:
  id: serena-find-symbol
  name: Serena Find Symbol
  description: Finds a symbol by name path and returns its location and definition. Goes to the definition
    instead of guessing which of nine same-named functions is the one. Grep cannot tell them apart.
category: capability
implementation:
  type: mcp_tool
  server: serena
  tool: find_symbol
iam:
  required_scopes:
  - workspace:read
provenance:
  authored_by: human
  version: 1.0.0
  requires_runtime: '>=1.199.0'
  registry: swarmkit-skills
