apiVersion: swarmkit/v1
kind: Skill
metadata:
  id: serena-replace-symbol-body
  name: Serena Replace Symbol Body
  description: Replaces the body of a symbol, leaving its signature alone. A structural edit rather than
    a line-range one, so it does not corrupt a file when the line numbers have moved since the agent last
    looked.
category: capability
implementation:
  type: mcp_tool
  server: serena
  tool: replace_symbol_body
iam:
  required_scopes:
  - workspace:write
provenance:
  authored_by: human
  version: 1.0.0
  requires_runtime: '>=1.199.0'
  registry: swarmkit-skills
