apiVersion: swarmkit/v1
kind: Skill
metadata:
  id: serena-symbols-overview
  name: Serena Symbols Overview
  description: "Lists the symbols defined in a file \u2014 classes, methods, functions. Lets an agent\
    \ understand a file's shape without reading it, which is the difference between a hundred tokens and\
    \ ten thousand."
category: capability
implementation:
  type: mcp_tool
  server: serena
  tool: get_symbols_overview
iam:
  required_scopes:
  - workspace:read
provenance:
  authored_by: human
  version: 1.0.0
  requires_runtime: '>=1.199.0'
  registry: swarmkit-skills
