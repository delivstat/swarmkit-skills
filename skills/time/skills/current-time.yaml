apiVersion: swarmkit/v1
kind: Skill
metadata:
  id: current-time
  name: Current Time
  description: Returns the current time in a timezone. A model has no clock and will confidently invent
    one. Any agent reasoning about schedules, deadlines or recency needs this or it makes things up.
category: capability
implementation:
  type: mcp_tool
  server: time
  tool: get_current_time
iam:
  required_scopes:
  - workspace:read
provenance:
  authored_by: human
  version: 1.0.0
  requires_runtime: '>=1.199.0'
  registry: swarmkit-skills
